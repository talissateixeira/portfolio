<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Roteiro para aprovação · Talissa Müller</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%237B9482%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2219%22%20width%3D%2230%22%20height%3D%228%22%20rx%3D%222.5%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%2228%22%20y%3D%2219%22%20width%3D%228%22%20height%3D%2227%22%20rx%3D%222.5%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2251.5%22%20r%3D%223%22%20fill%3D%22%23D8A62B%22%2F%3E%3C%2Fsvg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   Página de aprovação de roteiro — visual limpo (estilo Apple), que veste
   a identidade de cada marca: logo no topo, a cor da marca como acento e
   um bloco escuro para o gancho. As cores --marca* saem da paleta do mood
   board (JS: aplicarTema). Sem paleta, fica no verde sálvia da Talissa.
   ========================================================================= */
@font-face {
  font-family: "The Seasons";
  src: url("../fontes/The-Seasons-Regular.ttf") format("truetype");
  font-weight: 400; font-style: normal; font-display: swap;
}
:root {
  --fundo: #ffffff;
  --cinza: #f5f5f7;
  --tinta: #1d1d1f;
  --tinta-suave: #6e6e73;
  --linha: #e5e5ea;
  --verde: #1e7a3e;
  --marca: #5C7564;
  --marca-escura: #26302A;
  --marca-clara: #E6EDE3;
  --marca-texto: #3C4B40;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  --assinatura: "The Seasons", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: clip; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--marca); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

.pagina { max-width: 920px; margin: 0 auto; padding: 0 20px 88px; }

/* ---------- Topo: logo da marca + assinatura ---------- */
.topo { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--linha); min-height: 89px; }
.topo .assina { font-size: .8rem; color: var(--tinta-suave); text-align: right; line-height: 1.35; }
.topo .assina b { display: block; color: var(--tinta); font-weight: 600; }
.marca-logo { display: inline-flex; align-items: center; height: 44px; }
.marca-logo img { display: block; height: 100%; width: auto; max-width: 180px; object-fit: contain; }
.marca-nome { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }

/* ---------- Estados (carregando / erro) ---------- */
.estado { padding: 90px 0; text-align: center; color: var(--tinta-suave); }
.estado h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; color: var(--tinta); margin: 0 0 8px; }
.estado p { margin: 0; }

/* ---------- Capa ---------- */
.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 44px; align-items: center; padding: 52px 0 44px; }
.hero.sem-foto { grid-template-columns: 1fr; max-width: 720px; }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--marca-texto); }
.hero h1 { font-size: clamp(2.2rem, 6.4vw, 3.4rem); font-weight: 700; line-height: 1.03; letter-spacing: -.035em; margin: 12px 0 16px; overflow-wrap: anywhere; }
.hero .ideia { margin: 0; font-size: 1.12rem; line-height: 1.55; color: var(--tinta-suave); white-space: pre-wrap; }
.ficha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px; margin: 28px 0 0; padding: 22px 0 0; border-top: 1px solid var(--linha); }
.ficha div { min-width: 0; }
.ficha dt { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); margin-bottom: 3px; }
.ficha dd { margin: 0; font-size: .93rem; line-height: 1.4; }
.hero-foto { border-radius: 28px; overflow: hidden; background: var(--marca-clara); aspect-ratio: 4 / 5; }
.hero-foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; gap: 28px; padding: 34px 0 30px; }
  .hero-foto { aspect-ratio: 1 / 1; order: -1; }
}

/* ---------- Avisos ---------- */
.aviso { margin: 0 0 8px; padding: 16px 20px; border-radius: 18px; background: var(--cinza); font-size: .95rem; }
.aviso b { display: block; font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
.aviso.aprovado b { color: var(--verde); }
.aviso.ajuste b { color: var(--marca-texto); }
.instrucao { margin: 0 0 8px; padding: 16px 20px; border-radius: 18px; background: var(--cinza); color: var(--tinta-suave); font-size: .95rem; }
.instrucao b { color: var(--tinta); font-weight: 600; }

/* ---------- O gancho (o bloco forte da marca) ---------- */
.bloco-gancho { margin-top: 44px; padding: clamp(28px, 6vw, 52px); border-radius: 28px; background: var(--marca-escura); color: #fff; }
.bloco-gancho .eyebrow { color: rgba(255,255,255,.72); }
.bloco-gancho p { margin: 12px 0 0; font-size: clamp(1.5rem, 4.4vw, 2.3rem); font-weight: 600; line-height: 1.18; letter-spacing: -.025em; }
.bloco-gancho ul { margin: 22px 0 0; padding: 18px 0 0 20px; border-top: 1px solid rgba(255,255,255,.18); font-size: .95rem; color: rgba(255,255,255,.82); }
.bloco-gancho li + li { margin-top: 4px; }

/* ---------- Seções ---------- */
.secao { margin-top: 72px; }
.secao > .eyebrow { display: block; margin-bottom: 8px; }
h2 { font-size: clamp(1.6rem, 4.6vw, 2.2rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 28px; }
.intro { margin: -14px 0 24px; color: var(--tinta-suave); }

/* ---------- Mood board ---------- */
.mood { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.mood.uma { grid-template-columns: 1fr; }
@media (max-width: 720px) { .mood { grid-template-columns: 1fr; gap: 28px; } }
.sub { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); margin-bottom: 10px; }
.clima { margin: 0; padding: 0; list-style: none; font-size: 1.05rem; line-height: 1.5; }
.clima li { position: relative; padding-left: 18px; }
.clima li + li { margin-top: 8px; }
.clima li::before { content: ""; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; border-radius: 50%; background: var(--marca); }
.clima-texto { margin: 0; font-size: 1.05rem; line-height: 1.65; white-space: pre-wrap; }
.tags { margin: 16px 0 0; font-size: .9rem; font-weight: 500; color: var(--marca-texto); }
.faixa { display: flex; height: 76px; border-radius: 18px; overflow: hidden; border: 1px solid var(--linha); }
.faixa i { flex: 1; }
.nomes { display: flex; margin-top: 10px; }
.nomes span { flex: 1; min-width: 0; padding-right: 6px; font-size: .74rem; line-height: 1.3; color: var(--tinta-suave); overflow-wrap: anywhere; }
.nomes b { display: block; color: var(--tinta); font-weight: 500; font-size: .8rem; }
.paleta-nota { margin: 12px 0 0; font-size: .85rem; color: var(--tinta-suave); }
.imagens { display: grid; grid-template-columns: repeat(var(--colunas, 3), minmax(0, 1fr)); gap: 14px; margin-top: 40px; }
@media (max-width: 720px) { .imagens { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.imagens figure { margin: 0; min-width: 0; }
.imagens .moldura { border-radius: 20px; overflow: hidden; background: var(--cinza); aspect-ratio: 4 / 5; }
.imagens img { display: block; width: 100%; height: 100%; object-fit: cover; }
.imagens figure.largo { grid-column: 1 / -1; }
.imagens figure.largo .moldura { aspect-ratio: 21 / 9; }
@media (max-width: 720px) { .imagens figure.largo .moldura { aspect-ratio: 4 / 3; } }
.imagens .vaga { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18px; border: 1.5px dashed var(--marca); background: var(--marca-clara); }
.imagens .vaga b { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--marca-texto); }
.imagens .vaga span { margin-top: 6px; font-size: .82rem; color: var(--tinta-suave); }
.imagens figcaption { margin-top: 8px; font-size: .8rem; color: var(--tinta-suave); line-height: 1.4; }
.imagens figcaption b { display: block; color: var(--tinta); font-weight: 600; font-size: .9rem; }
.imagens figcaption em { display: inline-block; margin-top: 6px; font-style: normal; font-size: .76rem; padding: 3px 9px; border-radius: 99px; background: var(--marca-clara); color: var(--marca-texto); }

/* ---------- Cenas ---------- */
.cenas { border-top: 1px solid var(--linha); }
.cena { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 28px; padding: 30px 0; border-bottom: 1px solid var(--linha); }
.cena-lado .num { display: block; font-size: 2.1rem; font-weight: 700; letter-spacing: -.04em; line-height: 1; color: #c7c7cc; }
.cena.destaque .num { color: var(--marca); }
.cena-lado .nome { display: block; margin-top: 10px; font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.cena-lado .tempo { display: block; margin-top: 2px; font-size: .82rem; color: var(--tinta-suave); }
@media (max-width: 620px) {
  .cena { grid-template-columns: 1fr; gap: 12px; padding: 26px 0; }
  .cena-lado { display: flex; align-items: baseline; gap: 10px; }
  .cena-lado .num { font-size: 1.6rem; }
  .cena-lado .nome { margin-top: 0; }
  .cena-lado .tempo { margin: 0 0 0 auto; }
}
.campo { margin: 0 0 14px; }
.campo:last-child { margin-bottom: 0; }
.campo > b { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); margin-bottom: 4px; }
.campo.visual { color: var(--tinta-suave); font-size: .95rem; white-space: pre-wrap; }
.fala { display: block; font-size: 1.22rem; font-weight: 500; line-height: 1.42; letter-spacing: -.012em; color: var(--tinta); white-space: pre-wrap; }
.tom { display: block; margin-top: 6px; font-size: .86rem; color: var(--tinta-suave); font-style: italic; }
.tela { display: inline-block; padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(--marca); color: var(--marca-texto); font-weight: 600; font-size: .84rem; }

/* ---------- Ler só as falas ---------- */
.falas { margin-top: 22px; border-radius: 18px; background: var(--cinza); padding: 0 20px; }
.falas summary { cursor: pointer; padding: 15px 0; font-weight: 600; list-style: none; }
.falas summary::-webkit-details-marker { display: none; }
.falas summary::after { content: "+"; float: right; color: var(--marca-texto); font-weight: 700; }
.falas[open] summary::after { content: "–"; }
.falas-texto { padding: 0 0 18px; font-size: 1.05rem; line-height: 1.65; }
.falas-texto p { margin: 0 0 10px; }

/* ---------- Comentário por cena ---------- */
.comentar { margin-top: 14px; }
.btn-comentar { background: none; border: 0; padding: 4px 0; font-size: .88rem; font-weight: 600; color: var(--marca-texto); cursor: pointer; }
.btn-comentar::before { content: "+ "; }
.caixa-comentario { display: block; width: 100%; min-height: 84px; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 14px; background: var(--cinza); resize: vertical; font-size: .95rem; }
.caixa-comentario:focus { outline: 2px solid var(--marca); outline-offset: 1px; background: #fff; }

/* ---------- Variações de gancho ---------- */
.trocado { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; background: var(--marca-clara); font-size: .86rem; }
.trocado b { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--marca-texto); }
.trocado .btn-link { margin: 0 0 0 auto; }
.ganchos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.gancho { display: flex; flex-direction: column; padding: 24px; border-radius: 22px; background: var(--cinza); border: 2px solid transparent; transition: border-color .2s ease, background .2s ease; }
.gancho.em-uso { background: #fff; border-color: var(--marca); }
.gancho .tipo { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--marca-texto); }
.gancho .fala-g { display: block; margin: 10px 0 12px; font-size: 1.1rem; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
.gancho .extra { margin: 0 0 6px; font-size: .86rem; color: var(--tinta-suave); }
.gancho .acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: auto; padding-top: 14px; }
.gancho .acoes .btn-link { margin: 0; }
.btn-trocar { border-radius: 99px; padding: 10px 20px; font-weight: 600; font-size: .9rem; cursor: pointer; border: 0; background: var(--tinta); color: #fff; }
.btn-trocar:hover { background: var(--marca-escura); }
.btn-trocar:active { transform: scale(.98); }
.selo-uso { font-size: .86rem; font-weight: 600; color: var(--marca-texto); }

/* ---------- Detalhes ---------- */
.colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; align-items: start; }
.colunas h3 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
.colunas ol, .colunas ul { margin: 0; padding-left: 20px; }
.colunas li { margin-bottom: 8px; font-size: .95rem; color: #3a3a3c; }
.colunas li:last-child { margin-bottom: 0; }
.colunas li::marker { color: var(--marca); }
.colunas p { margin: 0; font-size: .95rem; color: #3a3a3c; white-space: pre-wrap; }
.colunas .nota { margin-top: 10px; font-size: .85rem; color: var(--tinta-suave); }
.cta-box { padding: 22px; border-radius: 22px; background: var(--marca-clara); }
.cta-box p.cta-txt { font-size: 1.25rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; color: var(--tinta); }
.confirmar-box { margin-top: 40px; padding: 22px 24px; border-radius: 22px; border: 1.5px dashed var(--marca); }
.confirmar-box h3 { margin: 0 0 10px; font-size: 1.05rem; font-weight: 600; }
.confirmar-box ol { margin: 0; padding-left: 20px; }
.confirmar-box li { margin-bottom: 6px; font-size: .95rem; }
.confirmar-box li::marker { color: var(--marca); font-weight: 600; }
.confirmar-box p { margin: 10px 0 0; font-size: .85rem; color: var(--tinta-suave); }

/* ---------- Resposta ---------- */
.resposta { margin-top: 72px; padding: clamp(24px, 5vw, 40px); border-radius: 28px; background: var(--cinza); }
.resposta h2 { margin-bottom: 8px; }
.resposta > p { margin: 0 0 14px; color: var(--tinta-suave); }
.resposta .caixa-comentario { background: #fff; }
.resposta label { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); margin: 16px 0 0; }
.resposta input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 14px; background: #fff; font-size: .95rem; }
.resposta input:focus { outline: 2px solid var(--marca); outline-offset: 1px; }
.contador { font-size: .88rem; color: var(--tinta-suave); margin: 12px 0 0; }
.botoes { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.btn { flex: 1 1 200px; border-radius: 99px; padding: 15px 22px; font-weight: 600; font-size: 1rem; cursor: pointer; border: 1px solid var(--tinta); transition: transform .15s ease, opacity .15s ease; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-ajuste { background: #fff; color: var(--tinta); border-color: var(--linha); }
.btn-aprovar { background: var(--tinta); color: #fff; }
.confirmar { margin-top: 16px; padding: 16px 18px; border-radius: 18px; background: #fff; font-size: .95rem; }
.confirmar .botoes { margin-top: 12px; }
.erro { color: #b23a2e; font-weight: 600; margin: 12px 0 0; }
.btn-link { background: none; border: 0; padding: 4px 0; margin-top: 8px; font-size: .9rem; font-weight: 500; color: var(--tinta-suave); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.rodape { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--linha); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--tinta-suave); }
.rodape .assinatura { font-family: var(--assinatura); font-size: 1.25rem; color: var(--tinta); }
</style>
</head>
<body>
<main class="pagina">
  <header class="topo" id="topo">
    <span class="marca-nome">Roteiro UGC</span>
    <span class="assina"><b>Talissa Müller</b>UGC Creator · talissamuller.com</span>
  </header>

  <div class="estado" id="carregando"><p>Carregando o roteiro…</p></div>

  <div class="estado" id="erro" hidden>
    <h1>Roteiro não encontrado</h1>
    <p>Esse link pode estar incompleto. É só responder a mensagem que te mandou ele.</p>
  </div>

  <div class="estado" id="erro-conexao" hidden>
    <h1>Não carregou agora</h1>
    <p>Confira a internet e tente de novo.</p>
    <div class="botoes" style="justify-content:center"><button class="btn btn-aprovar" id="btn-recarregar" type="button" style="flex:0 0 auto">Recarregar</button></div>
  </div>

  <section id="roteiro" hidden></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/banco.js?v=20261027"></script>
<script>
(function () {
  "use strict";
  // =====================================================================
  // APROVAÇÃO DE ROTEIRO. O link /roteiro/?id=…&token=… (gerado na aba
  // Roteiros do painel) abre o roteiro pela função ver_roteiro e responde
  // pela comentar_roteiro. A marca escreve os comentários por cena e o
  // geral, e manda TUDO de uma vez: "Aprovar roteiro" (o texto contém
  // "Roteiro aprovado!", que o painel usa pra mover o card) ou
  // "Solicitar ajuste". Cada envio vira 1 comentário + 1 push no iPhone.
  // =====================================================================
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const token = params.get("token");
  const $ = (s) => document.querySelector(s);
  const area = $("#roteiro");

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function lista(v) { return Array.isArray(v) ? v.filter((x) => x != null && String(typeof x === "object" ? JSON.stringify(x) : x).trim()) : []; }
  function txt(v) { return String(v == null ? "" : v).trim(); }
  // Só aceita links http(s) em imagens (nada de javascript: etc.)
  function urlSegura(u) { u = txt(u); return /^https?:\/\//i.test(u) ? u : ""; }
  function semAspas(t) { return txt(t).replace(/^["“]|["”]$/g, "").trim(); }
  function slug(t) { return txt(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function dataHora(iso) {
    try { return new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "long", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
  }

  function mostrarEstado(qual) {
    ["#carregando", "#erro", "#erro-conexao"].forEach((s) => { $(s).hidden = s !== qual; });
    area.hidden = true;
  }
  $("#btn-recarregar").addEventListener("click", () => location.reload());
  if (!id || !token) { mostrarEstado("#erro"); return; }

  // Rascunho dos comentários neste aparelho (não perde se fechar a página)
  const chaveRascunho = "roteiro_rascunho_" + String(token).slice(0, 12);
  const chaveResposta = "roteiro_resposta_" + String(token).slice(0, 12);
  function ler(chave) { try { return JSON.parse(localStorage.getItem(chave) || "null"); } catch (e) { return null; } }
  function gravar(chave, v) { try { localStorage.setItem(chave, JSON.stringify(v)); } catch (e) {} }
  function apagar(chave) { try { localStorage.removeItem(chave); } catch (e) {} }

  // ---------- Cores da marca ----------
  function hexOk(h) { h = txt(h); if (h && !h.startsWith("#")) h = "#" + h; return /^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(h) ? h : null; }
  function rgb(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map((c) => c + c).join(""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  function hex(c) { return "#" + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join(""); }
  function mix(a, b, t) { const x = rgb(a), y = rgb(b); return hex(x.map((v, i) => v + (y[i] - v) * t)); }
  function luz(h) { return rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0); }
  function contraste(a, b) { const l1 = luz(a), l2 = luz(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); }
  function escurecerAte(cor, fundo, alvo) { let c = cor; for (let t = 0.08; contraste(c, fundo) < alvo && t <= 1; t += 0.08) c = mix(cor, "#000000", t); return c; }

  function aplicarTema(paleta) {
    const cores = paleta.map((p) => hexOk(p.cor)).filter(Boolean);
    if (!cores.length) return; // fica no sálvia da Talissa
    // A cor principal: a 1ª da paleta que não seja quase branca nem quase preta
    const principal = cores.find((c) => luz(c) > 0.03 && luz(c) < 0.6) || cores[0];
    const raiz = document.documentElement.style;
    raiz.setProperty("--marca", principal);
    raiz.setProperty("--marca-texto", escurecerAte(principal, "#FFFFFF", 4.5));
    raiz.setProperty("--marca-escura", luz(principal) < 0.06 ? principal : mix(principal, "#000000", 0.55));
    raiz.setProperty("--marca-clara", mix(principal, "#FFFFFF", 0.86));
  }

  // ---------- Topo: logo da marca (painel → portfólio → nome escrito) ----------
  function desenharTopo(r) {
    const marca = txt(r.marca);
    $("#topo").innerHTML =
      `<span class="marca-logo" id="topo-logo"${marca ? "" : " hidden"}><span class="marca-nome">${esc(marca)}</span></span>` +
      `<span class="assina"><b>Roteiro UGC</b>por Talissa Müller</span>`;
    const fontes = [urlSegura(r.logo_url), marca ? "../logos-marcas/" + slug(marca) + ".png" : ""].filter(Boolean);
    (function tentar(i) {
      if (i >= fontes.length) return;
      const img = new Image();
      img.onload = () => { const box = $("#topo-logo"); box.hidden = false; box.innerHTML = ""; img.alt = marca; box.appendChild(img); };
      img.onerror = () => tentar(i + 1);
      img.src = fontes[i];
    })(0);
  }

  // ---------- Carregar ----------
  (async function carregar() {
    let dados = null, falhou = null;
    for (let t = 1; t <= 3; t++) {
      try {
        const { data, error } = await sb.rpc("ver_roteiro", { p_id: id, p_token: token });
        if (error) throw error;
        dados = data; falhou = null; break;
      } catch (e) {
        falhou = e;
        if (t < 3) await new Promise((res) => setTimeout(res, 700 * t));
      }
    }
    if (falhou) { mostrarEstado("#erro-conexao"); return; }
    if (!dados || !dados.roteiro) { mostrarEstado("#erro"); return; }
    desenhar(dados.roteiro, dados.cenas || [], dados.moodboard || []);
  })();

  let cenasAtuais = [];
  let ultimoDesenho = null;

  // ---------- Variações de gancho ----------
  // G.lista = board.ganchos; G.idx = cena do gancho; G.escolha = variação em uso (null = original)
  const G = { lista: [], idx: -1, original: null, fraseOriginal: "", escolha: null };

  function camposCena(c) {
    const fala = semAspas(c.narracao);
    return (fala ? `<div class="campo"><span class="fala">“${esc(fala)}”</span>${txt(c.tom) ? `<span class="tom">${esc(c.tom)}</span>` : ""}</div>` : "") +
      (txt(c.cena) ? `<p class="campo visual"><b>Visual</b>${esc(c.cena)}</p>` : "") +
      (txt(c.texto_tela) ? `<p class="campo"><b>Texto na tela</b><span class="tela">${esc(semAspas(c.texto_tela))}</span></p>` : "");
  }
  function ganchoEscolhido() { return G.escolha == null ? null : G.lista[G.escolha] || null; }
  function camposGancho() {
    const g = ganchoEscolhido(), o = G.original || {};
    if (!g) return camposCena(o);
    return `<div class="trocado"><b>Gancho trocado</b>${txt(g.tipo) ? `<span>Variação: ${esc(g.tipo)}</span>` : ""}<button type="button" class="btn-link" data-original>Voltar ao original</button></div>` +
      camposCena({ narracao: g.fala, tom: "", cena: txt(g.visual) || o.cena, texto_tela: txt(g.tela) ? g.tela : "" });
  }
  function listaGanchosHtml() {
    return G.lista.map((g, i) => {
      const emUso = G.escolha === i;
      return `<div class="gancho${emUso ? " em-uso" : ""}">` +
        (txt(g.tipo) ? `<span class="tipo">${esc(g.tipo)}</span>` : "") +
        `<span class="fala-g">“${esc(semAspas(g.fala))}”</span>` +
        (txt(g.visual) ? `<p class="extra"><b>Visual:</b> ${esc(g.visual)}</p>` : "") +
        (txt(g.tela) ? `<p class="extra"><b>Texto na tela:</b> ${esc(semAspas(g.tela))}</p>` : "") +
        `<div class="acoes">${emUso
          ? `<span class="selo-uso">Em uso no roteiro</span><button type="button" class="btn-link" data-original>Voltar ao original</button>`
          : `<button type="button" class="btn-trocar" data-trocar="${i}">Trocar por esse</button>`}</div></div>`;
    }).join("");
  }
  function trocarGancho(i) {
    G.escolha = i;
    const campos = $("#campos-gancho"); if (campos) campos.innerHTML = camposGancho();
    const lista = $("#lista-ganchos"); if (lista) lista.innerHTML = listaGanchosHtml();
    const ref = $("#gancho-ref"), g = ganchoEscolhido();
    if (ref) ref.textContent = "“" + (g ? semAspas(g.fala) : G.fraseOriginal) + "”";
  }

  function desenhar(r, cenas, moodboard) {
    cenasAtuais = cenas;
    ultimoDesenho = [r, cenas, moodboard];
    const b = (r.board && typeof r.board === "object") ? r.board : {};
    const paleta = lista(b.paleta).filter((p) => p && typeof p === "object");
    aplicarTema(paleta);
    desenharTopo(r);
    document.title = "Roteiro " + (txt(r.marca) ? r.marca + " · " : "") + (r.titulo || "") + " | Talissa Müller";

    const faixa = (tempo) => { const m = String(tempo || "").match(/(\d+)\s*(?:-|–|a|até)\s*(\d+)/); return m ? [Number(m[1]), Number(m[2])] : null; };
    const ultima = cenas.length ? faixa(cenas[cenas.length - 1].tempo) : null;

    // ---- Imagens disponíveis (a 1ª boa vira a foto da capa) ----
    const produtos = lista(b.produtos).filter((p) => p && typeof p === "object");
    const fotos = lista(b.fotos).filter((f) => f && typeof f === "object");
    const refs = moodboard.map((m) => urlSegura(m.url)).filter(Boolean);
    const fotoCapa = urlSegura(b.capa_url) || urlSegura((produtos.find((p) => urlSegura(p.foto)) || {}).foto) ||
      urlSegura((fotos.find((f) => urlSegura(f.foto)) || {}).foto) || refs[0] || "";

    // ---- Capa ----
    const eyebrow = [txt(r.marca), txt(b.campanha) || txt(r.subtitulo)].filter(Boolean).join(" · ") || "Roteiro para aprovação";
    const ideia = txt(r.objetivo) || (txt(b.campanha) ? txt(r.subtitulo) : "");
    const ficha = [];
    if (txt(r.formato)) ficha.push(["Formato", r.formato]);
    if (ultima) ficha.push(["Duração", "cerca de " + ultima[1] + " segundos"]);
    if (cenas.length) ficha.push(["Cenas", cenas.length + (cenas.length === 1 ? " cena" : " cenas")]);
    ficha.push(["Creator", "Talissa Müller"]);
    if (txt(b.campanha) && txt(r.subtitulo)) ficha.push(["Campanha", r.subtitulo]);
    const hero = `<section class="hero${fotoCapa ? "" : " sem-foto"}"><div class="hero-texto">
        <div class="eyebrow">${esc(eyebrow)}</div>
        <h1>${esc(r.titulo || "Roteiro")}</h1>
        ${ideia ? `<p class="ideia">${esc(ideia)}</p>` : ""}
        <dl class="ficha">${ficha.map((p) => `<div><dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd></div>`).join("")}</dl>
      </div>${fotoCapa ? `<div class="hero-foto"><img src="${esc(fotoCapa)}" alt=""></div>` : ""}</section>`;

    // ---- Aviso / instrução ----
    const respondi = ler(chaveResposta);
    let aviso;
    if (r.status === "aprovado" || (respondi && respondi.acao === "aprovar")) {
      aviso = `<div class="aviso aprovado"><b>Roteiro aprovado</b>${respondi && respondi.acao === "aprovar" ? "Aprovado em " + esc(dataHora(respondi.quando)) + ". " : ""}Obrigada! Agora é comigo: vou gravar.</div>`;
    } else if (respondi && respondi.acao === "ajuste") {
      aviso = `<div class="aviso ajuste"><b>Ajustes enviados</b>Recebi os seus comentários em ${esc(dataHora(respondi.quando))}. Vou ajustar e te mando a nova versão neste mesmo link.</div>`;
    } else {
      aviso = `<p class="instrucao">Leia com calma. Para mudar alguma coisa, toque em <b>Comentar esta cena</b>${lista(b.ganchos).length ? " ou troque o gancho por uma das variações" : ""}. No final, é só aprovar ou pedir os ajustes.</p>`;
    }

    // ---- Gancho em destaque ----
    const g = b.gancho || {};
    const idxGancho = Math.max(0, cenas.findIndex((c) => /hook|gancho/i.test(c.tag || "")));
    const fraseGancho = semAspas(g.frase) || (cenas[idxGancho] ? semAspas(cenas[idxGancho].narracao) : "");
    G.lista = lista(b.ganchos).filter((x) => x && typeof x === "object" && txt(x.fala));
    G.idx = cenas.length ? idxGancho : -1;
    G.original = cenas[idxGancho] || null;
    G.fraseOriginal = fraseGancho;
    const salvoG = (ler(chaveRascunho) || {}).gancho || (respondi && respondi.gancho);
    G.escolha = salvoG && typeof salvoG.indice === "number" && G.lista[salvoG.indice] ? salvoG.indice : null;
    const fraseBloco = ganchoEscolhido() ? semAspas(ganchoEscolhido().fala) : fraseGancho;
    const notasGancho = lista(g.notas).concat(txt(g.nota) ? [g.nota] : []);
    const blocoGancho = fraseBloco
      ? `<section class="bloco-gancho"><span class="eyebrow">O gancho</span><p id="gancho-ref">“${esc(fraseBloco)}”</p>${notasGancho.length ? `<ul>${notasGancho.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</section>`
      : "";

    // ---- Mood board ----
    const clima = lista(b.clima);
    const chips = lista(b.chips);
    const climaTexto = txt(b.clima_texto);
    // Itens curtinhos viram tags ("luz natural · tons quentes"); frases longas viram lista
    const climaCurto = clima.length && clima.every((c) => String(c).trim().split(/\s+/).length <= 4);
    const tagsClima = (climaCurto ? clima : []).concat(chips);
    const cores = paleta.filter((p) => hexOk(p.cor));
    const figs = [];
    produtos.forEach((p) => {
      const u = urlSegura(p.foto);
      if (!u && !txt(p.nome)) return;
      const leg = `<figcaption>${txt(p.nome) ? `<b>${esc(p.nome)}</b>` : ""}${esc(p.descricao || "")}${txt(p.obs) ? `<br><em>${esc(p.obs)}</em>` : ""}</figcaption>`;
      figs.push(`<figure${p.largo ? ' class="largo"' : ""}>${u ? `<div class="moldura"><img src="${esc(u)}" alt="${esc(p.nome || "produto")}" loading="lazy"></div>` : ""}${leg}</figure>`);
    });
    fotos.forEach((f, i) => {
      const u = urlSegura(f.foto);
      if (u && u === fotoCapa && !urlSegura(b.capa_url)) return; // já está na capa
      const quadro = u ? `<div class="moldura"><img src="${esc(u)}" alt="${esc(f.legenda || "foto")}" loading="lazy"></div>`
        : `<div class="moldura vaga"><b>${esc(f.rotulo || "Foto " + (i + 1))}</b>${txt(f.descricao) ? `<span>${esc(f.descricao)}</span>` : ""}</div>`;
      figs.push(`<figure>${quadro}${txt(f.legenda) ? `<figcaption>${esc(f.legenda)}</figcaption>` : ""}</figure>`);
    });
    refs.forEach((u) => (u === fotoCapa && !urlSegura(b.capa_url)) || figs.push(`<figure><div class="moldura"><img src="${esc(u)}" alt="referência" loading="lazy"></div></figure>`));
    const nFigs = figs.length;
    let mood = "";
    if (cores.length || climaTexto || clima.length || chips.length || nFigs) {
      const ladoClima = (climaTexto || clima.length || chips.length)
        ? `<div><span class="sub">Clima</span>` +
          (climaTexto ? `<p class="clima-texto">${esc(climaTexto)}</p>` : "") +
          (clima.length && !climaCurto ? `<ul class="clima"${climaTexto ? ' style="margin-top:14px"' : ""}>${clima.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : "") +
          (tagsClima.length ? `<p class="tags"${climaTexto || !climaCurto ? "" : ' style="margin-top:0;font-size:1.05rem"'}>${tagsClima.map(esc).join(" · ")}</p>` : "") +
          `</div>`
        : "";
      const ladoPaleta = cores.length
        ? `<div><span class="sub">Paleta</span><div class="faixa">${cores.map((p) => `<i style="background:${hexOk(p.cor)}" title="${esc(p.nota || "")}"></i>`).join("")}</div>
           <div class="nomes">${cores.map((p) => `<span><b>${esc(p.nome || "")}</b>${esc(hexOk(p.cor).toUpperCase())}</span>`).join("")}</div>
           ${txt(b.paleta_nota) ? `<p class="paleta-nota">${esc(b.paleta_nota)}</p>` : ""}</div>`
        : "";
      const topoMood = ladoClima || ladoPaleta ? `<div class="mood${ladoClima && ladoPaleta ? "" : " uma"}">${ladoClima}${ladoPaleta}</div>` : "";
      mood = `<section class="secao"><span class="eyebrow">Mood board</span><h2>O clima do vídeo</h2>${topoMood}` +
        (nFigs ? `<div class="imagens" style="--colunas:${Math.min(nFigs, 3)};${topoMood ? "" : "margin-top:0"}">${figs.join("")}</div>` : "") + `</section>`;
    }

    // ---- Cena a cena ----
    const rascunho = ler(chaveRascunho) || {};
    const rascCenas = rascunho.cenas || {};
    const htmlCenas = cenas.map((c, i) => {
      const num = String(i + 1).padStart(2, "0");
      const rasc = rascCenas[i] || "";
      return `<article class="cena${i === idxGancho && fraseGancho ? " destaque" : ""}">
        <div class="cena-lado"><span class="num">${num}</span>${txt(c.tag) ? `<span class="nome">${esc(c.tag)}</span>` : ""}${txt(c.tempo) ? `<span class="tempo">${esc(c.tempo)}</span>` : ""}</div>
        <div class="cena-corpo">
          ${i === G.idx && G.lista.length ? `<div id="campos-gancho">${camposGancho()}</div>` : camposCena(c)}
          <div class="comentar">
            <button type="button" class="btn-comentar" data-abrir="${i}"${rasc ? " hidden" : ""}>Comentar esta cena</button>
            <textarea class="caixa-comentario" data-cena="${i}" placeholder="O que você gostaria de mudar nesta cena?" aria-label="Comentário da cena ${num}"${rasc ? "" : " hidden"}>${esc(rasc)}</textarea>
          </div>
        </div>
      </article>`;
    }).join("");
    const falas = cenas.map((c) => semAspas(c.narracao)).filter(Boolean);
    const lerFalas = falas.length > 1 ? `<details class="falas"><summary>Ler só as falas, do começo ao fim</summary><div class="falas-texto">${falas.map((f) => `<p>${esc(f)}</p>`).join("")}</div></details>` : "";
    const secaoCenas = cenas.length
      ? `<section class="secao"><span class="eyebrow">Roteiro</span><h2>Cena a cena</h2><div class="cenas">${htmlCenas}</div>${lerFalas}</section>` : "";

    const secaoGanchos = G.lista.length
      ? `<section class="secao"><span class="eyebrow">Para escolher</span><h2>Variações de gancho</h2>
         <p class="intro">Prefere outro começo? Toque em <b>Trocar por esse</b> e ${G.idx >= 0 ? "a cena " + String(G.idx + 1).padStart(2, "0") + " muda" : "o gancho muda"} na hora. Dá para voltar ao original quando quiser.</p>
         <div class="ganchos" id="lista-ganchos">${listaGanchosHtml()}</div></section>` : "";

    // ---- Detalhes: gravação e cuidados ----
    const pontos = txt(r.pontos_importantes).split(/\n+/).map((l) => l.replace(/^\s*(?:[-•*–✓✅]|\d+[.)])\s*/, "").trim()).filter(Boolean);
    const dif = lista(b.diferenciais), evitar = lista(b.evitar), pend = lista(b.pendencias);
    const cta = b.cta || {};
    const col = [];
    const ul = (itens) => `<ul>${itens.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (pontos.length) col.push(`<div><h3>O que não pode faltar</h3>${ul(pontos)}</div>`);
    if (dif.length) col.push(`<div><h3>Diferenciais que entram no vídeo</h3>${ul(dif)}${txt(b.diferenciais_nota) ? `<p class="nota">${esc(b.diferenciais_nota)}</p>` : ""}</div>`);
    if (evitar.length) col.push(`<div><h3>O que eu evito</h3>${ul(evitar)}</div>`);
    if (txt(cta.texto)) col.push(`<div class="cta-box"><span class="sub">Chamada final</span><p class="cta-txt">${esc(cta.texto)}</p>${txt(cta.nota) ? `<p class="nota">${esc(cta.nota)}</p>` : ""}</div>`);
    const confirmar = pend.length ? `<div class="confirmar-box"><h3>Preciso confirmar com você</h3><ol>${pend.map((p) => `<li>${esc(p)}</li>`).join("")}</ol><p>Pode me responder no comentário geral, lá embaixo.</p></div>` : "";
    const detalhes = col.length || confirmar
      ? `<section class="secao"><span class="eyebrow">Detalhes</span><h2>Gravação e cuidados</h2>${col.length ? `<div class="colunas">${col.join("")}</div>` : ""}${confirmar}</section>` : "";

    // ---- Resposta ----
    const jaRespondeu = !!respondi || r.status === "aprovado";
    const resposta = `<section class="resposta" id="resposta">
        <h2>Sua resposta</h2>
        <div id="resposta-feita"${jaRespondeu ? "" : " hidden"}>
          <p style="margin:0;color:var(--tinta-suave)">Sua resposta já chegou pra mim. Obrigada! 💛</p>
          <button type="button" class="btn-link" id="btn-responder-de-novo">Quero mandar outro comentário</button>
        </div>
        <div id="resposta-form"${jaRespondeu ? " hidden" : ""}>
          <p>Algum comentário geral sobre o roteiro? (opcional)</p>
          <textarea class="caixa-comentario" id="comentario-geral" maxlength="4000" placeholder="Ex.: o tom está ótimo, só quero trocar a frase final.">${esc(rascunho.geral || "")}</textarea>
          <label for="nome-marca">Seu nome (opcional)</label>
          <input id="nome-marca" type="text" maxlength="80" placeholder="Ex.: Ana, da ${esc(txt(r.marca) || "marca")}" value="${esc(rascunho.nome || "")}">
          <p class="contador" id="contador"></p>
          <div class="botoes" id="botoes">
            <button type="button" class="btn btn-ajuste" id="btn-ajuste">Solicitar ajuste</button>
            <button type="button" class="btn btn-aprovar" id="btn-aprovar">Aprovar roteiro</button>
          </div>
          <div class="confirmar" id="confirmar" hidden></div>
          <p class="erro" id="erro-envio" hidden></p>
        </div>
      </section>`;

    area.innerHTML = hero + aviso + blocoGancho + mood + secaoCenas + secaoGanchos + detalhes + resposta +
      `<footer class="rodape"><span>Roteiro ${esc(txt(r.marca) ? r.marca + " · " : "")}${esc(r.titulo || "")}</span><span class="assinatura">Talissa Müller</span></footer>`;

    $("#carregando").hidden = true;
    area.hidden = false;
    atualizarContador();
  }

  // ---------- Comentários: juntar, contar, guardar rascunho ----------
  function coletar() {
    const cenas = {};
    area.querySelectorAll("textarea[data-cena]").forEach((t) => { const v = t.value.trim(); if (v) cenas[t.dataset.cena] = v; });
    const geral = $("#comentario-geral");
    const nome = $("#nome-marca");
    const saida = { cenas, geral: geral ? geral.value.trim() : "", nome: nome ? nome.value.trim() : "" };
    const g = ganchoEscolhido();
    if (g) saida.gancho = { indice: G.escolha, tipo: txt(g.tipo), fala: semAspas(g.fala) };
    return saida;
  }
  function rotuloCena(i) {
    const c = cenasAtuais[i] || {};
    return "Cena " + String(Number(i) + 1).padStart(2, "0") + (txt(c.tag) ? " — " + txt(c.tag) : "");
  }
  // O texto que chega no painel (e no push): uma resposta só, organizada
  function montarTexto(acao, c) {
    const partes = [];
    if (c.gancho) partes.push("Gancho trocado" + (c.gancho.tipo ? " (" + c.gancho.tipo + ")" : "") + ": “" + c.gancho.fala + "”");
    Object.keys(c.cenas).sort((a, b) => a - b).forEach((i) => partes.push(rotuloCena(i) + ": " + c.cenas[i]));
    if (c.geral) partes.push("Geral: " + c.geral);
    if (acao === "aprovar") return "✅ Roteiro aprovado!" + (partes.length ? "\n\nObservações:\n" + partes.join("\n\n") : "");
    return "✏️ Pediu ajustes:\n\n" + partes.join("\n\n");
  }
  function atualizarContador() {
    const el = $("#contador");
    if (!el) return;
    const c = coletar(), n = Object.keys(c.cenas).length, partes = [];
    if (n) partes.push(n + (n === 1 ? " cena comentada" : " cenas comentadas"));
    if (c.gancho) partes.push("gancho trocado");
    el.textContent = partes.length ? partes.join(" · ") + "." : "";
  }

  area.addEventListener("click", (e) => {
    const trocar = e.target.closest("[data-trocar]"), original = e.target.closest("[data-original]");
    if (trocar || original) {
      trocarGancho(trocar ? Number(trocar.dataset.trocar) : null);
      gravar(chaveRascunho, coletar());
      atualizarContador();
      if (trocar && $("#campos-gancho")) $("#campos-gancho").closest(".cena").scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    const abrir = e.target.closest("[data-abrir]");
    if (abrir) {
      const caixa = area.querySelector(`textarea[data-cena="${abrir.dataset.abrir}"]`);
      caixa.hidden = false; abrir.hidden = true; caixa.focus();
      return;
    }
    if (e.target.closest("#btn-responder-de-novo")) {
      $("#resposta-feita").hidden = true;
      $("#resposta-form").hidden = false;
      $("#comentario-geral").focus();
      return;
    }
    if (e.target.closest("#btn-aprovar")) {
      const c = coletar();
      const obs = (c.gancho ? " O gancho que você escolheu entra no lugar do original." : "") + (Object.keys(c.cenas).length || c.geral ? " Os comentários que você escreveu vão junto, como observação." : "");
      perguntar("<b>Aprovar o roteiro?</b><br>Depois de aprovado, eu sigo para a gravação." + obs, "Sim, aprovar", "aprovar");
      return;
    }
    if (e.target.closest("#btn-ajuste")) {
      const c = coletar();
      const erro = $("#erro-envio");
      if (!Object.keys(c.cenas).length && !c.geral && !c.gancho) {
        erro.textContent = "Escreva pelo menos um comentário (numa cena ou no comentário geral) ou troque o gancho, para eu saber o que ajustar.";
        erro.hidden = false;
        return;
      }
      const n = Object.keys(c.cenas).length;
      const resumo = [];
      if (n) resumo.push(n + (n === 1 ? " cena comentada" : " cenas comentadas"));
      if (c.gancho) resumo.push("gancho trocado");
      if (c.geral) resumo.push("comentário geral");
      const frase = resumo.join(", ").replace(/, ([^,]*)$/, " e $1");
      perguntar("<b>Enviar os ajustes?</b><br>" + frase.charAt(0).toUpperCase() + frase.slice(1) + ". Eu ajusto e te mando a nova versão neste mesmo link.", "Enviar ajustes", "ajuste");
    }
  });
  area.addEventListener("input", (e) => {
    if (!/TEXTAREA|INPUT/.test(e.target.tagName)) return;
    gravar(chaveRascunho, coletar());
    atualizarContador();
  });

  function perguntar(html, rotuloSim, acao) {
    const confirmar = $("#confirmar");
    $("#erro-envio").hidden = true;
    confirmar.innerHTML = html + `<div class="botoes"><button type="button" class="btn btn-ajuste" id="btn-nao">Voltar</button><button type="button" class="btn btn-aprovar" id="btn-sim">${rotuloSim}</button></div>`;
    confirmar.hidden = false;
    $("#botoes").hidden = true;
    $("#btn-nao").onclick = () => { confirmar.hidden = true; $("#botoes").hidden = false; };
    $("#btn-sim").onclick = function () { enviar(acao, this, rotuloSim); };
  }

  // Grava o comentário; o banco avisa a Talissa por push (banco-avisar-comentario-pelo-banco.sql).
  async function enviar(acao, botao, rotulo) {
    const c = coletar();
    botao.disabled = true;
    botao.textContent = "Enviando…";
    try {
      const { error } = await sb.rpc("comentar_roteiro", { p_id: id, p_token: token, p_nome: c.nome, p_texto: montarTexto(acao, c) });
      if (error) throw error;
      // O push pra Talissa sai do próprio banco (trigger trg_avisar_comentario).
      apagar(chaveRascunho);
      gravar(chaveResposta, { acao: acao, quando: new Date().toISOString(), gancho: c.gancho || null });
      desenhar.apply(null, ultimoDesenho); // redesenha já com o aviso de "aprovado"/"ajustes enviados"
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      botao.disabled = false;
      botao.textContent = rotulo;
      const erro = $("#erro-envio");
      erro.textContent = "Não consegui enviar agora. Confira a internet e tente de novo; seus comentários continuam aqui.";
      erro.hidden = false;
    }
  }
})();
</script>
