<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login | meu.painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #D4572A;
    --coral-escuro: #B8461F;
    --creme: #F5F3EF;
    --branco: #FFFFFF;
    --grafite: #1A1816;
    --texto-suave: #6B645C;
    --borda: #DDD8D0;
    --sucesso: #2D7A4F;
    --erro: #C4453C;
    --sombra: 0 12px 32px rgba(26, 24, 22, 0.1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--creme);
    color: var(--grafite);
    font-family: "DM Sans", sans-serif;
  }

  .cartao-login {
    width: 100%;
    max-width: 400px;
    background: var(--branco);
    border-radius: 24px;
    box-shadow: var(--sombra);
    padding: 44px 36px;
  }

  .logo {
    font-family: "Fraunces", serif;
    font-size: 1.4rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 28px;
  }
  .logo .ponto { color: var(--coral); }

  h1 {
    font-family: "Fraunces", serif;
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 8px;
    text-align: center;
  }

  .subtitulo {
    color: var(--texto-suave);
    font-size: 0.95rem;
    text-align: center;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .faixa {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.88rem;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .faixa-erro { background: rgba(196, 69, 60, 0.1); color: var(--erro); }
  .faixa-sucesso { background: rgba(45, 122, 79, 0.1); color: var(--sucesso); }
  .faixa[hidden] { display: none; }

  .campo { margin-bottom: 18px; }
  .campo label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .campo input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--borda);
    font-family: "DM Sans", sans-serif;
    font-size: 0.98rem;
    background: var(--creme);
    color: var(--grafite);
  }
  .campo input:focus {
    outline: none;
    border-color: var(--coral);
  }

  .link-esqueci {
    display: block;
    text-align: right;
    font-size: 0.85rem;
    color: var(--texto-suave);
    text-decoration: none;
    margin: -6px 0 20px;
  }
  .link-esqueci:hover { color: var(--coral); }

  .link-voltar {
    display: inline-block;
    margin-top: 18px;
    font-size: 0.85rem;
    color: var(--texto-suave);
    text-decoration: none;
  }
  .link-voltar:hover { color: var(--coral); }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 100px;
    border: none;
    background: var(--coral);
    color: var(--branco);
    font-family: "DM Sans", sans-serif;
    font-weight: 700;
    font-size: 0.98rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .btn:hover { background: var(--coral-escuro); }
  .btn:disabled { opacity: 0.7; cursor: default; }

  [hidden] { display: none !important; }

  .btn:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid var(--coral);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="cartao-login">
  <div class="logo">meu<span class="ponto">.</span>painel</div>
  <h1>Acesso restrito</h1>
  <p class="subtitulo">Faça login para ver os números do seu portfólio.</p>

  <div class="faixa faixa-erro" id="faixa-erro" hidden></div>
  <div class="faixa faixa-sucesso" id="faixa-sucesso" hidden></div>

  <form id="form-login">
    <div class="campo">
      <label for="campo-email">E-mail</label>
      <input type="email" id="campo-email" required autocomplete="username">
    </div>
    <div class="campo">
      <label for="campo-senha">Senha</label>
      <input type="password" id="campo-senha" required autocomplete="current-password">
    </div>
    <a href="#" class="link-esqueci" id="link-esqueci">Esqueci minha senha</a>
    <button type="submit" class="btn" id="btn-entrar">Entrar</button>
  </form>

  <form id="form-recuperar" hidden>
    <div class="campo">
      <label for="campo-email-recuperar">E-mail</label>
      <input type="email" id="campo-email-recuperar" required autocomplete="username">
    </div>
    <button type="submit" class="btn" id="btn-recuperar">Enviar link de recuperação</button>
    <a href="#" class="link-voltar" id="link-voltar">Voltar para o login</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  // Se já existir uma sessão ativa, pula direto para o painel.
  (async function verificarSessaoExistente() {
    const { data } = await Auth.sb.auth.getSession();
    if (data.session) {
      window.location.href = "painel.html";
    }
  })();

  const formLogin = document.getElementById("form-login");
  const formRecuperar = document.getElementById("form-recuperar");
  const linkEsqueci = document.getElementById("link-esqueci");
  const linkVoltar = document.getElementById("link-voltar");
  const faixaErro = document.getElementById("faixa-erro");
  const faixaSucesso = document.getElementById("faixa-sucesso");
  const btnEntrar = document.getElementById("btn-entrar");
  const btnRecuperar = document.getElementById("btn-recuperar");

  // Alterna entre o formulário de login e o de recuperação de senha.
  linkEsqueci.addEventListener("click", (e) => {
    e.preventDefault();
    formLogin.hidden = true;
    formRecuperar.hidden = false;
    faixaErro.hidden = true;
    faixaSucesso.hidden = true;
  });
  linkVoltar.addEventListener("click", (e) => {
    e.preventDefault();
    formRecuperar.hidden = true;
    formLogin.hidden = false;
    faixaErro.hidden = true;
    faixaSucesso.hidden = true;
  });

  formLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    faixaErro.hidden = true;
    const email = document.getElementById("campo-email").value.trim();
    const senha = document.getElementById("campo-senha").value;

    btnEntrar.disabled = true;
    btnEntrar.textContent = "Entrando...";
    try {
      await Auth.login(email, senha);
      window.location.href = "painel.html";
    } catch (err) {
      faixaErro.textContent = err.message;
      faixaErro.hidden = false;
      btnEntrar.disabled = false;
      btnEntrar.textContent = "Entrar";
    }
  });

  formRecuperar.addEventListener("submit", async (e) => {
    e.preventDefault();
    faixaErro.hidden = true;
    faixaSucesso.hidden = true;
    const email = document.getElementById("campo-email-recuperar").value.trim();

    btnRecuperar.disabled = true;
    btnRecuperar.textContent = "Enviando...";
    try {
      await Auth.recuperarSenha(email);
      faixaSucesso.textContent = "Verifique seu e-mail para redefinir sua senha.";
      faixaSucesso.hidden = false;
    } catch (err) {
      faixaErro.textContent = "Não foi possível enviar o e-mail agora. Tente novamente.";
      faixaErro.hidden = false;
    } finally {
      btnRecuperar.disabled = false;
      btnRecuperar.textContent = "Enviar link de recuperação";
    }
  });
</script>
</body>
</html>
