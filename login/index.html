<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Talissa Müller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --creme: #FAF8F4;
    --preto: #262220;
    --texto: #3A342E;
    --texto-suave: #79736A;
    --acento: #74907B;
    --acento-escuro: #5C7564;
    --borda: rgba(58, 52, 46, 0.16);
    --erro: #C4453C;
    --raio: 20px;
    --fonte-titulo: "Fraunces", "Georgia", serif;
    --fonte-base: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--creme);
    color: var(--preto);
    font-family: var(--fonte-base);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  body.pronto { opacity: 1; }
  .cartao {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 36px 30px;
    box-shadow: 0 20px 50px rgba(50, 31, 20, 0.08);
  }
  .marca {
    font-family: var(--fonte-titulo);
    font-size: 1.3rem;
    font-weight: 700;
    text-align: center;
    margin: 0 0 4px;
  }
  .subtitulo {
    text-align: center;
    font-size: 0.85rem;
    color: var(--texto-suave);
    margin: 0 0 28px;
  }
  .campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .campo label { font-size: 0.75rem; font-weight: 600; color: var(--texto-suave); }
  .campo input {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--borda);
    background: var(--creme);
    color: var(--preto);
    font-family: var(--fonte-base);
    font-size: 0.95rem;
  }
  .campo input:focus-visible, .botao-entrar:focus-visible, .link-recuperar:focus-visible {
    outline: 2px solid var(--acento);
    outline-offset: 2px;
  }
  .botao-entrar {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    border: none;
    border-radius: 100px;
    background: var(--acento);
    color: #fff;
    font-family: var(--fonte-base);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .botao-entrar:hover { background: var(--acento-escuro); }
  .botao-entrar:disabled { opacity: 0.6; cursor: default; }
  .faixa-erro {
    background: rgba(196, 69, 60, 0.1);
    border: 1px solid rgba(196, 69, 60, 0.35);
    color: var(--erro);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .faixa-erro[hidden], .faixa-aviso[hidden] { display: none; }
  .faixa-aviso {
    background: rgba(89, 25, 2, 0.06);
    border: 1px solid var(--borda);
    color: var(--texto);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .rodape-cartao {
    text-align: center;
    margin-top: 18px;
  }
  .link-recuperar {
    background: none;
    border: none;
    color: var(--texto-suave);
    font-family: var(--fonte-base);
    font-size: 0.82rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
</style>
</head>
<body>

<div class="cartao">
  <p class="marca">Talissa Müller</p>
  <p class="subtitulo">Entrar no painel</p>

  <p class="faixa-erro" id="faixa-erro" hidden></p>
  <p class="faixa-aviso" id="faixa-aviso" hidden></p>

  <form id="form-login">
    <div class="campo">
      <label for="campo-email">E-mail</label>
      <input type="email" id="campo-email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="campo-senha">Senha</label>
      <input type="password" id="campo-senha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="botao-entrar" id="botao-entrar">Entrar</button>
  </form>

  <div class="rodape-cartao">
    <button type="button" class="link-recuperar" id="botao-recuperar">Esqueci minha senha</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/banco.js"></script>
<script>
  const faixaErro = document.getElementById("faixa-erro");
  const faixaAviso = document.getElementById("faixa-aviso");

  function mostrarErro(mensagem) {
    faixaAviso.hidden = true;
    faixaErro.textContent = mensagem;
    faixaErro.hidden = false;
  }
  function mostrarAviso(mensagem) {
    faixaErro.hidden = true;
    faixaAviso.textContent = mensagem;
    faixaAviso.hidden = false;
  }

  // Se já tiver sessão aberta, pula direto pro admin.
  (async () => {
    if (await Banco.jaTemSessao()) {
      window.location.href = "../admin/index.html";
      return;
    }
    document.body.classList.add("pronto");
  })();

  const formLogin = document.getElementById("form-login");
  const botaoEntrar = document.getElementById("botao-entrar");
  formLogin.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    faixaErro.hidden = true;
    faixaAviso.hidden = true;
    const email = document.getElementById("campo-email").value.trim();
    const senha = document.getElementById("campo-senha").value;

    botaoEntrar.disabled = true;
    botaoEntrar.textContent = "Entrando...";
    try {
      await Banco.entrar(email, senha);
      window.location.href = "../admin/index.html";
    } catch (erro) {
      mostrarErro("E-mail ou senha incorretos.");
      botaoEntrar.disabled = false;
      botaoEntrar.textContent = "Entrar";
    }
  });

  document.getElementById("botao-recuperar").addEventListener("click", async () => {
    faixaErro.hidden = true;
    faixaAviso.hidden = true;
    const email = document.getElementById("campo-email").value.trim();
    if (!email) {
      mostrarErro("Digite seu e-mail ali em cima primeiro, depois clique em \"Esqueci minha senha\".");
      return;
    }
    try {
      await Banco.recuperarSenha(email);
      mostrarAviso("Te mandei um e-mail com o link pra criar uma senha nova.");
    } catch (erro) {
      mostrarErro("Não consegui enviar o e-mail agora. Tenta de novo em instantes.");
    }
  });
</script>
</body>
</html>
